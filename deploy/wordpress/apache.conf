ServerTokens Prod
ServerSignature Off
TraceEnable Off
<IfModule mpm_prefork_module>
  StartServers 1
  MinSpareServers 1
  MaxSpareServers 2
  MaxRequestWorkers 4
  MaxConnectionsPerChild 500
</IfModule>
<Directory /var/www/html/wp-content/uploads>
  <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
    Require all denied
  </FilesMatch>
</Directory>
