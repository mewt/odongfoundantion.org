# Nginx Server Configuration for odongfoundation.org
# Place in: /etc/nginx/sites-available/odongfoundation.org

server {
    listen 80;
    listen [::]:80;
    
    server_name odongfoundation.org www.odongfoundation.org;
    root /var/www/odongfoundation.org;
    index index.html;
    
    # Enable clean URLs (remove .html extensions)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    access_log /var/log/nginx/odongfoundation_access.log;
    error_log /var/log/nginx/odongfoundation_error.log;
}

# HTTPS Configuration (after SSL certificate installation)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name odongfoundation.org www.odongfoundation.org;
    root /var/www/odongfoundation.org;
    index index.html;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/odongfoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odongfoundation.org/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Enable clean URLs (remove .html extensions)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    access_log /var/log/nginx/odongfoundation_ssl_access.log;
    error_log /var/log/nginx/odongfoundation_ssl_error.log;
}