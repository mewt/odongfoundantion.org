# Apache Virtual Host Configuration for odongfoundation.org
# Place in: /etc/apache2/sites-available/odongfoundation.conf

<VirtualHost *:80>
    ServerName odongfoundation.org
    ServerAlias www.odongfoundation.org
    ServerAdmin webmaster@odongfoundation.org
    
    DocumentRoot /var/www/odongfoundation.org
    
    <Directory /var/www/odongfoundation.org>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable clean URLs (remove .html extensions)
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^([^\.]+)$ $1.html [NC,L]
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/odongfoundation_error.log
    CustomLog ${APACHE_LOG_DIR}/odongfoundation_access.log combined
</VirtualHost>

# For HTTPS (after SSL certificate installation)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName odongfoundation.org
    ServerAlias www.odongfoundation.org
    ServerAdmin webmaster@odongfoundation.org
    
    DocumentRoot /var/www/odongfoundation.org
    
    <Directory /var/www/odongfoundation.org>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable clean URLs (remove .html extensions)
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^([^\.]+)$ $1.html [NC,L]
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/odongfoundation_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/odongfoundation_ssl_access.log combined
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/odongfoundation.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/odongfoundation.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>