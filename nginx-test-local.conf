# Nginx Local Test Configuration
# Save as: /tmp/nginx-test.conf
# Run: nginx -c /tmp/nginx-test.conf

worker_processes 1;
error_log /tmp/nginx_error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /tmp/nginx_access.log;
    
    server {
        listen 8080;
        server_name localhost;
        root /tmp/test-clone;  # Change this to your test directory
        
        # Enable clean URLs (remove .html extensions)
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Security headers for testing
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}